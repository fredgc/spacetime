<h1 id="spacetime-について-v-version">Spacetime について (v{{ VERSION
}})</h1>
<p>Spacetimeは、ミンコフスキー時空図を用いてアインシュタインの特殊相対性理論を視覚的・対話的に学ぶための教育用作図ツールです。</p>
<h2 id="主な機能">主な機能</h2>
<ul>
<li><p><strong>対話的時空図</strong>：世界線、光円錐、事象、同時面を自由に描画。</p></li>
<li><p><strong>ローレンツ変換</strong>：異なる速度の慣性系間を連続的に変換。</p></li>
<li><p><strong>物理仮説の比較</strong>：相対論、エーテル説、光源速度説の違いを比較。</p></li>
<li><p><strong>インタラクティブチュートリアル</strong>：時間の遅れ、長さの収縮、双子のパラドックス等を体験。</p></li>
</ul>
