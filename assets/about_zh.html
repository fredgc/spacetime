<h1 id="关于-spacetime-v-version">关于 Spacetime (v{{ VERSION }})</h1>
<p>Spacetime是一款直观互动的教育级相对论绘图工具，旨在借助闵可夫斯基时空图直观探索狭义相对论的核心概念。</p>
<h2 id="核心特性">核心特性</h2>
<ul>
<li><p><strong>交互式时空图</strong>：自由绘制世界线、光锥、瞬时面与事件点。</p></li>
<li><p><strong>相对论变换</strong>：利用洛伦兹变换平滑切换不同速度的惯性参考系。</p></li>
<li><p><strong>物理假设对比</strong>：直观对比爱因斯坦相对论、以太假说与发射源理论。</p></li>
<li><p><strong>教学互动教程</strong>：涵盖时间膨胀、长度收缩、双生子悖论与超光速因果律。</p></li>
</ul>
