<h1 id="工具与操作控制">工具与操作控制</h1>
<h2 id="顶部工具栏">顶部工具栏</h2>
<ul>
<li><p><strong>选择</strong>：点击图表中的对象进行修改、拖动或删除。拖动空白区域可平移画布。</p></li>
<li><p><strong>添加</strong>：在时空中放置新对象（事件、时钟、光锥、列车、车库等）。</p></li>
<li><p><strong>光速假说模式</strong>：</p>
<ul>
<li><p><strong>洛伦兹变换</strong>：光速在所有参考系中恒定（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">c = 1</annotation></semantics></math>）。</p></li>
<li><p><strong>以太假说</strong>：光速仅相对于静止以太恒定。</p></li>
<li><p><strong>发射源速度</strong>：光速相对于发射源是相对的。</p></li>
</ul></li>
</ul>
<h2 id="底部滑块控制">底部滑块控制</h2>
<ul>
<li><p><strong>时间（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mi>t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>）</strong>：改变动画中的当前瞬时切片。</p></li>
<li><p><strong>速度（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mi>v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math>）</strong>：在<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>−</mi><mn>0.99</mn><mi>c</mi></mrow><annotation encoding="application/x-tex">-0.99c</annotation></semantics></math>到<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>+</mi><mn>0.99</mn><mi>c</mi></mrow><annotation encoding="application/x-tex">+0.99c</annotation></semantics></math>之间无缝调节观察者参考系速度。</p></li>
</ul>
