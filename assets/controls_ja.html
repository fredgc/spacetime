<h1 id="ツールと操作方法">ツールと操作方法</h1>
<h2 id="上部ツールバー">上部ツールバー</h2>
<ul>
<li><p><strong>選択</strong>：図上のオブジェクトを選択して編集・移動・削除します。</p></li>
<li><p><strong>追加</strong>：新しい時空オブジェクト（事象、時計、光円錐、列車など）を配置します。</p></li>
<li><p><strong>光速度モデル</strong>：</p>
<ul>
<li><p><strong>ローレンツ変換</strong>：光速度は全基準系で一定（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">c = 1</annotation></semantics></math>）。</p></li>
<li><p><strong>エーテル仮説</strong>：静止エーテルに対して光速度が一定。</p></li>
<li><p><strong>光源速度</strong>：光速度は光源に対して相対的。</p></li>
</ul></li>
</ul>
<h2 id="下部スライダー">下部スライダー</h2>
<ul>
<li><p><strong>時間（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mi>t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>）</strong>：アニメーションの現在時刻を移動。</p></li>
<li><p><strong>速度（<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mi>v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math>）</strong>：観測者基準系の速度を<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>−</mi><mn>0.99</mn><mi>c</mi></mrow><annotation encoding="application/x-tex">-0.99c</annotation></semantics></math>から<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>+</mi><mn>0.99</mn><mi>c</mi></mrow><annotation encoding="application/x-tex">+0.99c</annotation></semantics></math>まで変更。</p></li>
</ul>
