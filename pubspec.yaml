# to see old packages:   flutter pub outdated
# to try to upgrad:  flutter pub upgrade
# to also update pubspec.yaml: flutter pub upgrade --major-versions
# to list all packages: dart pub outdated --show-all
# dart pub upgrade

name: spacetime
description: "Spacetime Diagrams"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 6.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^12.0.0-beta.7
  file_saver: ^0.4.0           # Used for save as?
  firebase_auth: ^6.1.3         # Needed to authenitcate user (needed for drive).
  firebase_core: ^4.3.0         # Needed for any firebase.
  flex_color_picker: ^3.7.0
  webview_flutter: ^4.12.1
  webview_flutter_web: ^0.2.3
  flutter_native_splash: ^2.4.5
  go_router: ^17.0.1
  google_fonts: ^8.0.1
  google_sign_in: ^7.1.1        # Needed to authenitcate user (needed for drive).
  googleapis: ^16.0.0           # Needed for drive.
  googleapis_auth: ^2.0.0
  json_annotation: ^4.12.0
  mutex: ^3.1.0
  package_info_plus: ^10.2.0     # get version number from code.
  path_provider: ^2.1.5         # Used to get downloads directory.
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  petitparser: ^7.0.1
  flutter_secure_storage: ^10.0.0
  http: ^1.2.1
  html_tweak:
    path: ./html_tweak

dev_dependencies:
  flutter_test:
    sdk: flutter
  google_sign_in_mocks: ^0.4.1
  webview_flutter_platform_interface: ^2.15.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.25.8
  flutter_launcher_icons: any
  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  mockito: ^5.4.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/dev/
    - assets/css/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#9300ff"
    theme_color: "#ff00f4"
