    - assets/objects_de.html
    - assets/objects_es.html
    - assets/objects_fr.html
    - assets/objects_ja.html
    - assets/objects_lt.html
    - assets/objects_pt.html
    - assets/objects_zh.html
    - assets/overview.html
    - assets/overview_de.html
    - assets/overview_es.html
    - assets/overview_fr.html
    - assets/overview_ja.html
    - assets/overview_lt.html
    - assets/overview_pt.html
    - assets/overview_zh.html
    - assets/privacy.html
    - assets/privacy_de.html
    - assets/privacy_es.html
    - assets/privacy_fr.html
    - assets/privacy_ja.html
    - assets/privacy_lt.html
    - assets/privacy_pt.html
    - assets/privacy_zh.html
    - assets/slice.html
    - assets/terms.html
    - assets/terms_de.html
    - assets/terms_es.html
    - assets/terms_fr.html
    - assets/terms_ja.html
    - assets/terms_lt.html
    - assets/terms_pt.html
    - assets/terms_zh.html
    - assets/transformations.html
    - assets/transformations_de.html
    - assets/transformations_es.html
    - assets/transformations_fr.html
    - assets/transformations_ja.html
    - assets/transformations_lt.html
    - assets/transformations_pt.html
    - assets/transformations_zh.html
    - assets/dev/
    - assets/css/
    - assets/icons/
    - assets/tutorials/
    - assets/dev/tutorials/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#9300ff"
    theme_color: "#ff00f4"
